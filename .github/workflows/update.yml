name: Update Shadowrocket Rules

on:
  # 05:17 | 06:18 (Asia/Taipei)
  schedule:
    - cron: "17 21 * * *"
    - cron: "18 22 * * *"

  # Allow manual
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shadowrocket-rules
  cancel-in-progress: false

jobs:
  update:
    name: Update rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maxminddb==3.1.1

      - name: Prepare build directory
        run: |
          mkdir -p build

      # Tests run before any rule generation.  A semantic regression must stop
      # the workflow before tracked output files can be changed or committed.
      - name: Run converter tests
        run: |
          python -m unittest discover -s tests -v

      # =========================
      # China Domain
      # =========================

      - name: Download China domain list
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/cn.txt \
            https://raw.githubusercontent.com/v2fly/domain-list-community/release/cn.txt

          if [ ! -s build/cn.txt ]; then
            echo "Error: downloaded cn.txt is empty."
            exit 1
          fi

          echo "Downloaded China domain list:"
          wc -l build/cn.txt

      - name: Generate China-Domain.list
        run: |
          python scripts/convert.py \
            build/cn.txt \
            rules/China/China-Domain.list \
            --unsupported-output build/unsupported-v2fly-rules.txt

          if [ ! -s rules/China/China-Domain.list ]; then
            echo "Error: China-Domain.list is empty."
            exit 1
          fi

          echo "Generated China domain rules:"
          wc -l rules/China/China-Domain.list

      # =========================
      # OpenAI
      # =========================

      - name: Download OpenAI domain list
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/openai.txt \
            https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/openai

          if [ ! -s build/openai.txt ]; then
            echo "Error: downloaded OpenAI domain list is empty."
            exit 1
          fi

          echo "Downloaded OpenAI domain list:"
          wc -l build/openai.txt

          if grep -niE \
            '^[[:space:]]*include:[A-Za-z0-9!-]+([[:space:]]|#|$)' \
            build/openai.txt > build/openai-includes.txt; then
            echo "Error: OpenAI upstream contains include: directives."
            echo "Included lists must be resolved before publishing complete rules."
            sed -n '1,20p' build/openai-includes.txt
            exit 1
          fi

      - name: Generate OpenAI attribute views
        run: |
          python scripts/filter_v2fly.py \
            build/openai.txt \
            build/openai-noads.txt \
            --exclude-attribute ads

          python scripts/filter_v2fly.py \
            build/openai.txt \
            build/openai-ads.txt \
            --include-attribute ads

          count_ads_rules() {
            awk '
              {
                line = tolower($0)
                sub(/#.*/, "", line)
                if (line ~ /(^|[[:space:]:,])@ads([[:space:]:,]|$)/) {
                  count++
                }
              }
              END { print count + 0 }
            ' "$1"
          }

          count_rule_lines() {
            awk '
              {
                line = $0
                sub(/#.*/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line != "" && line !~ /^[@&]/) {
                  count++
                }
              }
              END { print count + 0 }
            ' "$1"
          }

          upstream_ads_count="$(count_ads_rules build/openai.txt)"
          filtered_ads_count="$(count_ads_rules build/openai-ads.txt)"
          filtered_rule_count="$(count_rule_lines build/openai-ads.txt)"

          if [ "$filtered_ads_count" -ne "$upstream_ads_count" ] \
            || [ "$filtered_rule_count" -ne "$upstream_ads_count" ]; then
            echo "Error: OpenAI @ads attribute filtering produced an inconsistent view."
            echo "Upstream @ads rules: $upstream_ads_count"
            echo "Filtered @ads rules: $filtered_ads_count"
            echo "Filtered total rules: $filtered_rule_count"
            exit 1
          fi

      - name: Generate OpenAI rules
        run: |
          python scripts/convert.py \
            build/openai.txt \
            rules/OpenAI/OpenAI.list \
            --unsupported-output build/unsupported-openai.txt

          python scripts/convert.py \
            build/openai-noads.txt \
            rules/OpenAI/OpenAI-NoAds.list \
            --unsupported-output build/unsupported-openai-noads.txt

          python scripts/convert.py \
            build/openai-ads.txt \
            rules/OpenAI/OpenAI-Ads.list \
            --unsupported-output build/unsupported-openai-ads.txt

          if [ ! -s rules/OpenAI/OpenAI.list ]; then
            echo "Error: OpenAI.list is empty."
            exit 1
          fi

          if [ ! -s rules/OpenAI/OpenAI-NoAds.list ]; then
            echo "Error: OpenAI-NoAds.list is empty."
            exit 1
          fi

          echo "Generated OpenAI rules:"
          wc -l rules/OpenAI/OpenAI.list
          wc -l rules/OpenAI/OpenAI-NoAds.list
          wc -l rules/OpenAI/OpenAI-Ads.list

      # =========================
      # AdGuard DNS Filter
      # =========================

      - name: Download AdGuard DNS Filter
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/adguard-filter.txt \
            https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt

          if [ ! -s build/adguard-filter.txt ]; then
            echo "Error: downloaded AdGuard DNS filter is empty."
            exit 1
          fi

          echo "Downloaded AdGuard DNS filter:"
          wc -l build/adguard-filter.txt

      - name: Generate Ad-Domain.list
        run: |
          python scripts/convert_adguard.py \
            build/adguard-filter.txt \
            rules/AdGuard/Ad-Domain.list \
            --unsupported-output build/unsupported-adguard-rules.txt

          if [ ! -s rules/AdGuard/Ad-Domain.list ]; then
            echo "Error: Ad-Domain.list is empty."
            exit 1
          fi

          echo "Generated AdGuard domain rules:"
          wc -l rules/AdGuard/Ad-Domain.list

      # =========================
      # China GeoIP
      # =========================

      - name: Download GeoLite2 Country database
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

          if [ ! -s build/GeoLite2-Country.mmdb ]; then
            echo "Error: GeoLite2-Country.mmdb is empty."
            exit 1
          fi

          echo "Downloaded GeoLite2 Country database:"
          ls -lh build/GeoLite2-Country.mmdb

      - name: Generate China GeoIP rules
        run: |
          python scripts/convert_geoip.py \
            build/GeoLite2-Country.mmdb \
            rules/China/GeoIP-CN.list \
            rules/China/GeoIP-CN-NoResolve.list

          if [ ! -s rules/China/GeoIP-CN.list ]; then
            echo "Error: GeoIP-CN.list is empty."
            exit 1
          fi

          if [ ! -s rules/China/GeoIP-CN-NoResolve.list ]; then
            echo "Error: GeoIP-CN-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated GeoIP rules:"
          wc -l rules/China/GeoIP-CN.list
          wc -l rules/China/GeoIP-CN-NoResolve.list

      # =========================
      # Show changes
      # =========================

      - name: Show changes
        run: |
          git status --short
          git diff --stat || true

      # =========================
      # Commit
      # =========================

      - name: Commit updated rules
        run: |
          git add -A -- rules/

          if git diff --cached --quiet; then
            echo "No rule changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Shadowrocket rules"
          git push
