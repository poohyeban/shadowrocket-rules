name: Update Shadowrocket Rules

on:
  schedule:
    - cron: "17 1 * * *"
      timezone: "Asia/Taipei"
    - cron: "43 5 * * *"
      timezone: "Asia/Taipei"

  # Allow manual
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shadowrocket-rules
  cancel-in-progress: false

jobs:
  update:
    name: Update rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maxminddb==3.1.1

      - name: Prepare build directory
        run: |
          mkdir -p build

      # Tests run before any rule generation.  A semantic regression must stop
      # the workflow before tracked output files can be changed or committed.
      - name: Run converter tests
        run: |
          python -m unittest discover -s tests -v

      # =========================
      # China Domain
      # =========================

      - name: Download China domain list
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/cn.txt \
            https://raw.githubusercontent.com/v2fly/domain-list-community/release/cn.txt

          if [ ! -s build/cn.txt ]; then
            echo "Error: downloaded cn.txt is empty."
            exit 1
          fi

          echo "Downloaded China domain list:"
          wc -l build/cn.txt

      - name: Generate China-v2fly-Domain.list
        run: |
          python scripts/convert.py \
            build/cn.txt \
            rules/China/Sources/China-v2fly-Domain.list \
            --unsupported-output build/unsupported-v2fly-rules.txt

          if [ ! -s rules/China/Sources/China-v2fly-Domain.list ]; then
            echo "Error: China-v2fly-Domain.list is empty."
            exit 1
          fi

          echo "Generated v2fly China domain rules:"
          wc -l rules/China/Sources/China-v2fly-Domain.list

      # =========================
      # OpenAI
      # =========================

      - name: Generate reviewed OpenAI official domain rules
        run: |
          python scripts/convert_openai_official_domains.py \
            data/OpenAI/official-domains.txt \
            rules/OpenAI/Sources/OpenAI-Official-Domain.list \
            --exclude-file data/OpenAI/official-domains-excluded.txt

          if [ ! -s rules/OpenAI/Sources/OpenAI-Official-Domain.list ]; then
            echo "Error: OpenAI-Official-Domain.list is empty."
            exit 1
          fi

          echo "Generated reviewed OpenAI official domain rules:"
          wc -l rules/OpenAI/Sources/OpenAI-Official-Domain.list

      - name: Download v2fly OpenAI domain list
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/openai-v2fly.txt \
            https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/openai

          if [ ! -s build/openai-v2fly.txt ]; then
            echo "Error: downloaded v2fly OpenAI domain list is empty."
            exit 1
          fi

          echo "Downloaded v2fly OpenAI domain list:"
          wc -l build/openai-v2fly.txt

          if grep -niE \
            '^[[:space:]]*include:[A-Za-z0-9!-]+([[:space:]]|#|$)' \
            build/openai-v2fly.txt > build/openai-includes.txt; then
            echo "Error: OpenAI upstream contains include: directives."
            echo "Included lists must be resolved before publishing complete rules."
            sed -n '1,20p' build/openai-includes.txt
            exit 1
          fi

      - name: Generate v2fly OpenAI rules
        run: |
          python scripts/convert.py \
            build/openai-v2fly.txt \
            rules/OpenAI/Sources/OpenAI-v2fly.list \
            --unsupported-output build/unsupported-openai-v2fly.txt

          if [ ! -s rules/OpenAI/Sources/OpenAI-v2fly.list ]; then
            echo "Error: OpenAI-v2fly.list is empty."
            exit 1
          fi

          echo "Generated v2fly OpenAI rules:"
          wc -l rules/OpenAI/Sources/OpenAI-v2fly.list

      - name: Download GeoLite2 ASN database
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/GeoLite2-ASN.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb

          if [ ! -s build/GeoLite2-ASN.mmdb ]; then
            echo "Error: GeoLite2-ASN.mmdb is empty."
            exit 1
          fi

          echo "Downloaded GeoLite2 ASN database:"
          ls -lh build/GeoLite2-ASN.mmdb

      - name: Generate OpenAI ASN rules
        run: |
          python scripts/convert_asn.py \
            build/GeoLite2-ASN.mmdb \
            rules/OpenAI/Sources/OpenAI-ASN-IP.list \
            rules/OpenAI/Sources/OpenAI-ASN-IP-NoResolve.list \
            --asn 401518 \
            --asn 401864

          if [ ! -s rules/OpenAI/Sources/OpenAI-ASN-IP.list ]; then
            echo "Error: OpenAI-ASN-IP.list is empty."
            exit 1
          fi

          if [ ! -s rules/OpenAI/Sources/OpenAI-ASN-IP-NoResolve.list ]; then
            echo "Error: OpenAI-ASN-IP-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated OpenAI ASN rules:"
          wc -l rules/OpenAI/Sources/OpenAI-ASN-IP.list
          wc -l rules/OpenAI/Sources/OpenAI-ASN-IP-NoResolve.list

      - name: Download ChatGPT Voice prefixes
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/chatgpt-voice.json \
            https://openai.com/chatgpt-voice.json

          if [ ! -s build/chatgpt-voice.json ]; then
            echo "Error: chatgpt-voice.json is empty."
            exit 1
          fi

          echo "Downloaded ChatGPT Voice prefixes:"
          wc -c build/chatgpt-voice.json

      - name: Generate ChatGPT Voice rules
        run: |
          python scripts/convert_openai_voice.py \
            build/chatgpt-voice.json \
            rules/OpenAI/Sources/OpenAI-Voice-IP.list \
            rules/OpenAI/Sources/OpenAI-Voice-IP-NoResolve.list

          if [ ! -s rules/OpenAI/Sources/OpenAI-Voice-IP.list ]; then
            echo "Error: OpenAI-Voice-IP.list is empty."
            exit 1
          fi

          if [ ! -s rules/OpenAI/Sources/OpenAI-Voice-IP-NoResolve.list ]; then
            echo "Error: OpenAI-Voice-IP-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated ChatGPT Voice rules:"
          wc -l rules/OpenAI/Sources/OpenAI-Voice-IP.list
          wc -l rules/OpenAI/Sources/OpenAI-Voice-IP-NoResolve.list

      - name: Merge and validate OpenAI rules
        run: |
          python scripts/merge_rules.py merge \
            rules/OpenAI/OpenAI.list \
            rules/OpenAI/Sources/OpenAI-v2fly.list \
            rules/OpenAI/Sources/OpenAI-Official-Domain.list \
            rules/OpenAI/Sources/OpenAI-ASN-IP.list \
            rules/OpenAI/Sources/OpenAI-Voice-IP.list

          python scripts/merge_rules.py merge \
            rules/OpenAI/OpenAI-NoResolve.list \
            rules/OpenAI/Sources/OpenAI-v2fly.list \
            rules/OpenAI/Sources/OpenAI-Official-Domain.list \
            rules/OpenAI/Sources/OpenAI-ASN-IP-NoResolve.list \
            rules/OpenAI/Sources/OpenAI-Voice-IP-NoResolve.list

          python scripts/merge_rules.py validate-pair \
            rules/OpenAI/OpenAI.list \
            rules/OpenAI/OpenAI-NoResolve.list

          if [ ! -s rules/OpenAI/OpenAI.list ]; then
            echo "Error: OpenAI.list is empty."
            exit 1
          fi

          if [ ! -s rules/OpenAI/OpenAI-NoResolve.list ]; then
            echo "Error: OpenAI-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated aggregate OpenAI rules:"
          wc -l rules/OpenAI/OpenAI.list
          wc -l rules/OpenAI/OpenAI-NoResolve.list

      # =========================
      # AdGuard DNS Filter
      # =========================

      - name: Download AdGuard DNS Filter
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/adguard-filter.txt \
            https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt

          if [ ! -s build/adguard-filter.txt ]; then
            echo "Error: downloaded AdGuard DNS filter is empty."
            exit 1
          fi

          echo "Downloaded AdGuard DNS filter:"
          wc -l build/adguard-filter.txt

      - name: Generate Ad-Domain.list
        run: |
          python scripts/convert_adguard.py \
            build/adguard-filter.txt \
            rules/AdGuard/Ad-Domain.list \
            --unsupported-output build/unsupported-adguard-rules.txt

          if [ ! -s rules/AdGuard/Ad-Domain.list ]; then
            echo "Error: Ad-Domain.list is empty."
            exit 1
          fi

          echo "Generated AdGuard domain rules:"
          wc -l rules/AdGuard/Ad-Domain.list

      # =========================
      # China GeoIP
      # =========================

      - name: Download GeoLite2 Country database
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

          if [ ! -s build/GeoLite2-Country.mmdb ]; then
            echo "Error: GeoLite2-Country.mmdb is empty."
            exit 1
          fi

          echo "Downloaded GeoLite2 Country database:"
          ls -lh build/GeoLite2-Country.mmdb

      - name: Generate China GeoIP rules
        run: |
          python scripts/convert_geoip.py \
            build/GeoLite2-Country.mmdb \
            rules/China/Sources/China-GeoIP.list \
            rules/China/Sources/China-GeoIP-NoResolve.list

          if [ ! -s rules/China/Sources/China-GeoIP.list ]; then
            echo "Error: China-GeoIP.list is empty."
            exit 1
          fi

          if [ ! -s rules/China/Sources/China-GeoIP-NoResolve.list ]; then
            echo "Error: China-GeoIP-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated China GeoIP source rules:"
          wc -l rules/China/Sources/China-GeoIP.list
          wc -l rules/China/Sources/China-GeoIP-NoResolve.list

      - name: Merge and validate China rules
        run: |
          python scripts/merge_rules.py merge \
            rules/China/China.list \
            rules/China/Sources/China-v2fly-Domain.list \
            rules/China/Sources/China-GeoIP.list

          python scripts/merge_rules.py merge \
            rules/China/China-NoResolve.list \
            rules/China/Sources/China-v2fly-Domain.list \
            rules/China/Sources/China-GeoIP-NoResolve.list

          python scripts/merge_rules.py validate-pair \
            rules/China/China.list \
            rules/China/China-NoResolve.list

          if [ ! -s rules/China/China.list ]; then
            echo "Error: China.list is empty."
            exit 1
          fi

          if [ ! -s rules/China/China-NoResolve.list ]; then
            echo "Error: China-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated aggregate China rules:"
          wc -l rules/China/China.list
          wc -l rules/China/China-NoResolve.list

      # =========================
      # Show changes
      # =========================

      - name: Show changes
        run: |
          git status --short
          git diff --stat || true

      # =========================
      # Commit
      # =========================

      - name: Commit updated rules
        run: |
          git add -A -- rules/

          if git diff --cached --quiet; then
            echo "No rule changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Shadowrocket rules"
          git push
