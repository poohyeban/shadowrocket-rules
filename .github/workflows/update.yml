name: Update Shadowrocket Rules

on:
  # 每天北京时间 05:17 和 06:18 自动运行，第二次作为兜底
  schedule:
    - cron: "17 21 * * *"
    - cron: "18 22 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shadowrocket-rules
  cancel-in-progress: false

jobs:
  update:
    name: Update rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maxminddb==3.1.1

      - name: Prepare build directory
        run: |
          mkdir -p build

      # Tests run before any rule generation.  A semantic regression must stop
      # the workflow before tracked output files can be changed or committed.
      - name: Run converter tests
        run: |
          python -m unittest discover -s tests -v

      # =========================
      # China Domain
      # =========================

      - name: Download China domain list
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/cn.txt \
            https://raw.githubusercontent.com/v2fly/domain-list-community/release/cn.txt

          if [ ! -s build/cn.txt ]; then
            echo "Error: downloaded cn.txt is empty."
            exit 1
          fi

          echo "Downloaded China domain list:"
          wc -l build/cn.txt

      - name: Generate China-Domain.list
        run: |
          python scripts/convert.py \
            build/cn.txt \
            rules/China-Domain.list \
            --unsupported-output build/unsupported-v2fly-rules.txt

          if [ ! -s rules/China-Domain.list ]; then
            echo "Error: China-Domain.list is empty."
            exit 1
          fi

          echo "Generated China domain rules:"
          wc -l rules/China-Domain.list

      # =========================
      # AdGuard DNS Filter
      # =========================

      - name: Download AdGuard DNS Filter
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/adguard-filter.txt \
            https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt

          if [ ! -s build/adguard-filter.txt ]; then
            echo "Error: downloaded AdGuard DNS filter is empty."
            exit 1
          fi

          echo "Downloaded AdGuard DNS filter:"
          wc -l build/adguard-filter.txt

      - name: Generate Ad-Domain.list
        run: |
          python scripts/convert_adguard.py \
            build/adguard-filter.txt \
            rules/Ad-Domain.list \
            --unsupported-output build/unsupported-adguard-rules.txt

          if [ ! -s rules/Ad-Domain.list ]; then
            echo "Error: Ad-Domain.list is empty."
            exit 1
          fi

          echo "Generated AdGuard domain rules:"
          wc -l rules/Ad-Domain.list

      # =========================
      # China GeoIP
      # =========================

      - name: Download GeoLite2 Country database
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output build/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

          if [ ! -s build/GeoLite2-Country.mmdb ]; then
            echo "Error: GeoLite2-Country.mmdb is empty."
            exit 1
          fi

          echo "Downloaded GeoLite2 Country database:"
          ls -lh build/GeoLite2-Country.mmdb

      - name: Generate China GeoIP rules
        run: |
          python scripts/convert_geoip.py \
            build/GeoLite2-Country.mmdb \
            rules/GeoIP-CN.list \
            rules/GeoIP-CN-NoResolve.list

          if [ ! -s rules/GeoIP-CN.list ]; then
            echo "Error: GeoIP-CN.list is empty."
            exit 1
          fi

          if [ ! -s rules/GeoIP-CN-NoResolve.list ]; then
            echo "Error: GeoIP-CN-NoResolve.list is empty."
            exit 1
          fi

          echo "Generated GeoIP rules:"
          wc -l rules/GeoIP-CN.list
          wc -l rules/GeoIP-CN-NoResolve.list

      # =========================
      # Show changes
      # =========================

      - name: Show changes
        run: |
          git status --short
          git diff --stat || true

      # =========================
      # Commit
      # =========================

      - name: Commit updated rules
        run: |
          git add \
            rules/China-Domain.list \
            rules/Ad-Domain.list \
            rules/GeoIP-CN.list \
            rules/GeoIP-CN-NoResolve.list

          if git diff --cached --quiet; then
            echo "No rule changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Shadowrocket rules"
          git push
